<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Boka ditt rum på Hotel El Tunco. Välj datum, antal gäster och rumstyp.">
    <title>Hotel El Tunco – Boka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">
        <a href="index.html" class="logo">Hotel El Tunco</a>
        <button type="button" class="meny-ikon" id="meny-knapp" aria-label="Öppna menyn"
            aria-expanded="false">&#9776;</button>

        <nav class="meny">
            <ul>
                <li><a href="index.html">Hem</a></li>
                <li><a href="boka.html" class="aktiv">Boka</a></li>
                <li><a href="aktiviteter.html">Aktiviteter</a></li>
                <li><a href="hitta.html">Hitta</a></li>
                <li><a href="kontakta.html">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="innehall">
            <h1>Boka ditt rum</h1>
            <p>Fyll i formuläret för att boka din vistelse.</p>

            <!-- Formulär: varje label hör ihop med sitt fält via for och id -->
            <form class="formular" action="#" method="post">
                <label for="namn">Namn</label>
                <input type="text" id="namn" name="namn" required>

                <label for="epost">E-post</label>
                <input type="email" id="epost" name="epost" required>

                <label for="ankomst">Ankomstdatum</label>
                <input type="date" id="ankomst" name="ankomst" required>

                <label for="avresa">Avresedatum</label>
                <input type="date" id="avresa" name="avresa" required>

                <label for="gaster">Antal gäster</label>
                <input type="number" id="gaster" name="gaster" min="1" max="6" value="1">

                <label for="rumstyp">Rumstyp</label>
                <select id="rumstyp" name="rumstyp">
                    <option value="standard">Standardrum</option>
                    <option value="havsutsikt">Rum med havsutsikt</option>
                    <option value="familj">Familjerum</option>
                </select>

                <button type="submit" class="knapp">Skicka</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <h2>Kontakt</h2>
        <address>
            Playa El Tunco, La Libertad, El Salvador<br>
            Tel: <a href="tel:+50300000000">+503 0000 0000</a><br>
            E-post: <a href="mailto:info@hotelsElTuncos.com">info@hotelsElTuncos.com</a>
        </address>
    </footer>

    <script src="script.js"></script>
</body>

</html>
